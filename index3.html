<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Sentiment Analyzer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 700px;
        }
        .card {
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-control {
            border-radius: 0.75rem;
        }
        .btn-primary {
            border-radius: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container d-flex flex-column justify-content-center align-items-center vh-100">
        <div class="card p-5 w-100">
            <h1 class="text-center mb-4">Movie Review Sentiment Analyzer</h1>
            <p class="text-center text-muted mb-4">
                Enter a movie review below to get a sentiment prediction from the GET API endpoint.
            </p>

            <form id="sentimentForm" class="mb-4">
                <div class="mb-3">
                    <label for="reviewText" class="form-label">Your Review</label>
                    <textarea class="form-control" id="reviewText" rows="6" placeholder="e.g., The movie was an absolute triumph from start to finish." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Analyze Sentiment</button>
            </form>

            <div id="resultContainer" class="mt-4 d-none">
                <h2 class="text-center mb-3">Prediction</h2>
                <div class="d-flex justify-content-between p-3 border rounded-3 bg-light">
                    <div class="text-center">
                        <strong>Sentiment:</strong>
                        <span id="sentimentResult" class="d-block mt-1 fw-bold fs-5"></span>
                    </div>
                    <div class="text-center">
                        <strong>Probability of Watching:</strong>
                        <span id="probabilityResult" class="d-block mt-1 fw-bold fs-5"></span>
                    </div>
                </div>
            </div>
            
            <div id="loadingIndicator" class="text-center mt-3 d-none">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <div id="errorContainer" class="mt-3 alert alert-danger d-none" role="alert">
                An error occurred. Please try again.
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('sentimentForm');
        const reviewText = document.getElementById('reviewText');
        const resultContainer = document.getElementById('resultContainer');
        const sentimentResult = document.getElementById('sentimentResult');
        const probabilityResult = document.getElementById('probabilityResult');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorContainer = document.getElementById('errorContainer');
        const apiEndpoint = 'http://127.0.0.1:8000/predict/';

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            // Clear previous results and show loading indicator
            resultContainer.classList.add('d-none');
            errorContainer.classList.add('d-none');
            loadingIndicator.classList.remove('d-none');

            // URL-encode the text to handle special characters and spaces
            const reviewSlug = encodeURIComponent(reviewText.value);
            const url = apiEndpoint + reviewSlug;
            
            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`API returned status code: ${response.status}`);
                }
                
                const data = await response.json();

                sentimentResult.textContent = data.sentiment;
                probabilityResult.textContent = `${(data.probability * 100).toFixed(2)}%`;
                
                // Set text color based on sentiment
                if (data.sentiment === 'positive') {
                    sentimentResult.className = 'd-block mt-1 fw-bold fs-5 text-success';
                } else {
                    sentimentResult.className = 'd-block mt-1 fw-bold fs-5 text-danger';
                }

                resultContainer.classList.remove('d-none');

            } catch (error) {
                console.error("Failed to fetch sentiment prediction:", error);
                errorContainer.classList.remove('d-none');
            } finally {
                loadingIndicator.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
